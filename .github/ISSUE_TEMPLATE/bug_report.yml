name: Bug report
description: Report something in CDUMM that's broken or behaving wrong.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        **Please paste CDUMM's bug report below.** In CDUMM, open **Bug Report**
        at the bottom of the sidebar and click **Copy to Clipboard**. The report
        has your app version, game version, storage layout, installed mods and
        the recent log, which is almost always what's needed to diagnose the
        problem.

        **CDUMM won't open?** Paste the last 100 lines of `cdumm.log` into the
        report box instead. It's in CDUMM's data folder:

        - Windows: `%LOCALAPPDATA%\cdumm`
        - macOS: `~/Library/Application Support/cdumm`
        - Linux, run from source: `~/.local/share/cdumm`
        - Linux, running the .exe through Proton or Wine: the Windows path inside that prefix

        The log isn't scrubbed like the report, so replace your user name in
        paths like `C:\Users\<name>\` if you'd rather not share it.
  - type: dropdown
    id: problem-type
    attributes:
      label: Type of problem
      description: Pick the closest match — it helps route the issue.
      options:
        - A mod won't install / only partly applies
        - Install or drag-and-drop fails
        - Game crashes (launch or in-game)
        - Wrong or missing result in-game
        - Update check / Nexus
        - Interface / other
    validations:
      required: true
  - type: dropdown
    id: install-source
    attributes:
      label: Game install source
      options:
        - Steam
        - Xbox / Microsoft Store (Game Pass)
        - Epic Games Store
        - Standalone / other
        - Not sure
    validations:
      required: true
  - type: textarea
    id: bug-report
    attributes:
      label: CDUMM bug report
      description: >
        Paste the report from CDUMM's Bug Report page here. The note at the top
        says where it is, and what to paste if CDUMM won't open.
      render: text
    validations:
      required: true
  - type: input
    id: mod
    attributes:
      label: Which mod, and its Nexus page?
      description: >
        Name the specific mod and link its Nexus page. "A mod won't apply" or
        "updates don't work" is very hard to chase down — one concrete example
        is what actually gets fixed. If it isn't about one mod, write "all mods"
        or "not mod-related".
      placeholder: "Example: Bigger Minimap — https://www.nexusmods.com/crimsondesert/mods/275"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What did you do, and what went wrong?
      description: >
        Steps to reproduce, what you expected, and what actually happened.
        Exact error text (or a screenshot) helps a lot.
    validations:
      required: true
  - type: checkboxes
    id: environment
    attributes:
      label: Environment checks
      description: >
        The report's own TL;DR flags these — they break mod installs and are
        not CDUMM bugs. Please rule them out first.
      options:
        - label: CDUMM is **not** running as administrator
        - label: The game is **not** installed under `Program Files`
        - label: The game exe does **not** have the "Run as administrator" compatibility flag set
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I'm on the latest CDUMM release
          required: true
        - label: I searched existing issues and didn't find a duplicate
          required: true
