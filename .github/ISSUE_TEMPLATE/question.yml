name: Question / how-to
description: Ask how to do something, or whether a behavior is expected.
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Many common questions are answered in the [FAQ](https://github.com/faisalkindi/CrimsonDesert-UltimateModsManager/issues/236),
        so please check it first. If it's not covered there, ask away.
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: checkboxes
    id: checked
    attributes:
      label: Before asking
      options:
        - label: I checked the FAQ and didn't find the answer
          required: true
